name: test
# push only on main: a PR branch would otherwise run everything twice (push + pull_request)
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - if: matrix.node == 22 && matrix.os == 'ubuntu-latest'
        run: npm i -g pnpm yarn
      - run: npm ci
      - run: npm test
        env:
          FULL: ${{ matrix.node == 22 && matrix.os == 'ubuntu-latest' && '1' || '' }}
