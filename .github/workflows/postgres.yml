name: postgres
on: [push, pull_request]
jobs:
  runtime:
    # Boots the generated --postgres apps against a real PostgreSQL and drives
    # CRUD/auth over HTTP (the "checkPostgresCrud" step in test/smoke.test.js).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test -- --test-name-pattern postgres
        env:
          FULL: '1'
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
