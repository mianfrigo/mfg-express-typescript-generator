name: release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
  id-token: write # npm provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm i -g pnpm yarn
      - run: npm test
        env:
          FULL: '1'
          # setup-node's registry-url writes an .npmrc that references
          # ${NODE_AUTH_TOKEN}; yarn 1 aborts when it is undefined. A dummy keeps
          # the tests from ever seeing the real publish token.
          NODE_AUTH_TOKEN: unused-during-tests
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
