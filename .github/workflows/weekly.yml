name: weekly
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
jobs:
  full:
    # Pinned versions must keep installing, building and linting.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        env:
          FULL: '1'
  outdated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/outdated.js >> "$GITHUB_STEP_SUMMARY"
